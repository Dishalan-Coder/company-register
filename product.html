<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Uki - Product Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-50 to-gray-100 flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white shadow-md border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <img src="uki.png" alt="Uki Logo" class="h-10 w-auto" />
                </div>

                <div class="flex items-center gap-5">
                    <p id="welcomeText" class="text-gray-700 font-semibold"></p>

                    <button id="logoutBtn"
                        class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-full font-semibold">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <main class="flex-grow px-6 py-10">
        <div class="max-w-5xl mx-auto">
            <!-- Product Form -->
            <div class="bg-white rounded-3xl shadow-xl border border-gray-200 p-8">
                <h1 class="text-3xl font-bold text-blue-700 text-center mb-2">
                    Product Details
                </h1>

                <p class="text-center text-gray-500 mb-8">
                    Add and manage your company products
                </p>

                <form id="productForm" class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    <!-- Product Name -->
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">
                            Product Name
                        </label>

                        <input type="text" id="productName" placeholder="Enter product name"
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />

                        <p id="productNameError" class="text-red-500 text-sm mt-1"></p>
                    </div>

                    <!-- Product Quantity -->
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">
                            Product Quantity
                        </label>

                        <input type="number" id="productQuantity" placeholder="Enter quantity"
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />

                        <p id="productQuantityError" class="text-red-500 text-sm mt-1"></p>
                    </div>

                    <!-- Product Price -->
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">
                            Product Price
                        </label>

                        <input type="number" id="productPrice" placeholder="Enter price"
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />

                        <p id="productPriceError" class="text-red-500 text-sm mt-1"></p>
                    </div>

                    <div class="md:col-span-3">
                        <button type="submit" id="submitBtn"
                            class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white py-3 rounded-xl font-bold shadow-md transition duration-300">
                            Add Product
                        </button>
                    </div>

                    <p id="successMessage" class="md:col-span-3 text-green-600 text-center font-semibold"></p>
                </form>
            </div>

            <!-- Output -->
            <div class="mt-10">
                <h2 class="text-2xl font-bold text-blue-700 mb-5">
                    Saved Product Details
                </h2>

                <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gradient-to-r from-blue-900 to-slate-900 text-gray-300">
        <div class="max-w-7xl mx-auto px-6 py-8">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img src="uki.png" alt="Uki Logo" class="h-8 w-auto opacity-90" />
                </div>

                <div class="text-center md:text-right">
                    <p class="text-sm">© 2026 Uki. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="product.js"></script>
</body>

</html>
