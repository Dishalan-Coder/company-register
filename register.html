<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uki - Company Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-50 to-gray-100 flex flex-col min-h-screen">
    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 bg-white backdrop-blur-md bg-opacity-95 shadow-md border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <img src="uki.png" alt="Uki Logo" class="h-10 w-auto" />
                </div>

                <div class="flex items-center gap-8">
                    <a href="index.html" class="text-gray-600 hover:text-blue-600 font-semibold transition duration-300 relative group">Home
                        <span
                            class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
                    </a>
                    <a href="product.html" class="text-gray-600 hover:text-blue-600 font-semibold transition duration-300 relative group">Product
                        <span
                            class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
                    </a>
                    <a href="login.html"
                        class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-8 py-2.5 rounded-full font-semibold shadow-md">
                        Login
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Register Form -->
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-gray-200 p-8">
            <h1 class="text-3xl font-bold text-center text-blue-700 mb-2">
                Company Register
            </h1>

            <p class="text-center text-gray-500 mb-8">
                Create your company account
            </p>

            <form id="registerForm" class="space-y-5">
                <!-- Company Name -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        Company Name
                    </label>
                    <input type="text" id="companyName" placeholder="Enter company name"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />
                    <p id="companyNameError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Company Email -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        Company Email
                    </label>
                    <input type="email" id="companyEmail" placeholder="Enter company email"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />
                    <p id="companyEmailError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        Password
                    </label>

                    <div class="relative">
                        <input type="password" id="password" placeholder="Enter password"
                            class="w-full px-4 py-3 pr-20 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />

                        <button type="button" id="togglePassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-blue-600 font-semibold">
                            Show
                        </button>
                    </div>

                    <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        Confirm Password
                    </label>

                    <div class="relative">
                        <input type="password" id="confirmPassword" placeholder="Confirm password"
                            class="w-full px-4 py-3 pr-20 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />

                        <button type="button" id="toggleConfirmPassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-blue-600 font-semibold">
                            Show
                        </button>
                    </div>

                    <p id="confirmPasswordError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white py-3 rounded-xl font-bold shadow-md transition duration-300">
                    Register
                </button>

                <p id="successMessage" class="text-green-600 text-center font-semibold"></p>
            </form>

            <!-- Login Navigation -->
            <div class="text-center mt-6">
                <p class="text-gray-600">Already registered?</p>

                <a href="login.html"
                    class="inline-block mt-3 border-2 border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white px-6 py-2 rounded-full font-semibold transition duration-300">
                    Go to Login
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gradient-to-r from-blue-900 to-slate-900 text-gray-300">
        <div class="max-w-7xl mx-auto px-6 py-8">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img src="uki.png" alt="Uki Logo" class="h-8 w-auto opacity-90" />
                </div>

                <div class="text-center md:text-right">
                    <p class="text-sm">© 2026 Uki. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="register.js"></script>
</body>

</html>
